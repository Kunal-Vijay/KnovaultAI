apiVersion: 1

# list of datasources that should be deleted from Grafana
deleteDatasources:
  - name: Prometheus

# list of datasources to insert/update
datasources:
  - name: Prometheus
    type: prometheus
    uid: prometheus_ds
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    version: 1
    editable: false
