version: '3.8'

services:
  fastapi_app:
    build:
      context: .
      dockerfile: docker/Dockerfile.fastapi
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app/app
      - ./alembic.ini:/app/alembic.ini
      - ./migrations:/app/migrations
    environment:
      - DATABASE_URL=postgresql://user:password@db:5432/ai_knowledge_base
    depends_on:
      - db
    # command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload # This is now handled by entrypoint.sh

  db:
    image: pgvector/pgvector:pg16
    environment:
      - POSTGRES_DB=ai_knowledge_base
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    ports:
      - "5433:5432" # host 5432 is often taken by a local Postgres install
    command: postgres -c 'shared_preload_libraries=vector'

volumes:
  postgres_data:
