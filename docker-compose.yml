version: '3.8'

services:
  fastapi_app:
    build:
      context: .
      dockerfile: docker/Dockerfile.fastapi
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app/app
      - ./migrations:/app/migrations
      - ./scripts:/app/scripts
      - document_storage:/app/data/documents
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://user:password@db:5432/ai_knowledge_base
      - LOCAL_STORAGE_DIR=/app/data/documents
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317 # OTLP gRPC endpoint
      - OTEL_SERVICE_NAME=fastapi-app
      - DEFAULT_LLM_PROVIDER=openrouter
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      # Use ${VAR-default} (not :-) so OPENROUTER_MODEL= in .env disables global override.
      - OPENROUTER_MODEL=${OPENROUTER_MODEL-}
      - OPENROUTER_FALLBACK_MODELS=${OPENROUTER_FALLBACK_MODELS:-}
      - OPENROUTER_BYOK_PROVIDERS=${OPENROUTER_BYOK_PROVIDERS:-google-ai-studio}
      - STORAGE_BACKEND=${STORAGE_BACKEND:-local}
      - SUPABASE_URL=${SUPABASE_URL:-}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY:-}
      - SUPABASE_STORAGE_BUCKET=${SUPABASE_STORAGE_BUCKET:-documents}
    depends_on:
      - db
      - otel-collector # Depend on OTel collector for traces
    # command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload # This is now handled by entrypoint.sh

  db:
    image: pgvector/pgvector:pg16
    environment:
      - POSTGRES_DB=ai_knowledge_base
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    ports:
      - "5433:5432" # host 5432 often taken by a local PostgreSQL install
    command: postgres -c 'shared_preload_libraries=vector' # Enable pgvector extension

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.90.1 # Use contrib for console exporter
    command: ["--config=/etc/otel-collector-config.yml"]
    volumes:
      - ./docker/otel-collector-config.yml:/etc/otel-collector-config.yml
    ports:
      - "4317:4317" # OTLP gRPC receiver
      - "4318:4318" # OTLP HTTP receiver
      - "13133:13133" # Health Check Extension
      - "8888:8888" # Prometheus metrics exposed by the collector itself

  prometheus:
    image: prom/prometheus:v2.48.0
    volumes:
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml
    command: --config.file=/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    depends_on:
      - fastapi_app # Scrapes metrics from fastapi_app

  grafana:
    image: grafana/grafana:10.2.2
    volumes:
      - grafana_data:/var/lib/grafana
      - ./docker/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources
      - ./docker/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173" # Default Vite port
    environment:
      VITE_API_PROXY_TARGET: http://fastapi_app:8000
    volumes:
      - ./frontend:/app
      # Keep image-installed deps; host bind mount would otherwise hide node_modules
      - frontend_node_modules:/app/node_modules
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    # Depends on fastapi_app so we can ensure the backend is running before starting the frontend
    depends_on:
      - fastapi_app

  frontend_prod:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    ports:
      - "8080:80"
    depends_on:
      - fastapi_app
    profiles:
      - prod

volumes:
  postgres_data:
  grafana_data:
  frontend_node_modules:
  document_storage:
